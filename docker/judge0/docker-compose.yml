# Judge0: may chay code cua sinh vien (bai thi lap trinh).
# Chay:  cd docker/judge0  &&  docker compose up -d
# Cong 2358 chi mo tren localhost (127.0.0.1) -> chi backend tren cung may goi duoc.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    logging: *default-logging
    restart: unless-stopped

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    mem_limit: 4g
    pids_limit: 512
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    logging: *default-logging
    restart: unless-stopped

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    logging: *default-logging
    restart: unless-stopped

volumes:
  judge0-data:
