spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
app.workspace.outbox.enabled=false
app.workspace.demo.enabled=false
app.task-alert.demo.enabled=false
GOOGLE_CLIENT_ID=local-test-client
GOOGLE_CLIENT_SECRET=local-test-secret
