# Application Name
spring.application.name=starter_project_2025
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.allow-bean-definition-overriding=true
# Allow a short migration window for access tokens issued before JWT claims
# were compacted. New ADMIN tokens stay well below this limit.
# Kept large enough to avoid "Request header is too large" for big ADMIN tokens.
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n

management.health.redis.enabled=false

# Database Configuration ---
# Keep prior local H2 files intact; use a separate database for this schema.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fams_lms_after_merge_fresh}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# Existing development startup behavior is unchanged unless explicitly disabled.
# Safe upgrades use the safe-deployment profile and reviewed, offline SQL migrations.
app.startup.mutations-enabled=${APP_STARTUP_MUTATIONS_ENABLED:true}
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}

# Local H2 acceptance fixtures; disable with WORKSPACE_DEMO_ENABLED=false.
app.seed.board.enabled=${APP_SEED_BOARD_ENABLED:true}
app.seed.team-allocation.enabled=${TEAM_ALLOCATION_DEMO_SEED_ENABLED:true}
# Opt-in US-PRJ-001 search/preview fixtures; never changes existing templates.
app.seed.us-prj-001.enabled=${US_PRJ_001_DEMO_SEED_ENABLED:false}
app.workspace.demo.enabled=${WORKSPACE_DEMO_ENABLED:true}
# Git fixtures are opt-in; a connected environment starts without sample activity.
app.git-activity.demo.enabled=${GIT_ACTIVITY_DEMO_ENABLED:false}

# Rolling 21-day sprint/backlog history for the workspace Analytics tab.
# Target the workspace project by code (or set the id to override it).
app.seed.analytics-demo.enabled=${APP_SEED_ANALYTICS_DEMO_ENABLED:true}
app.seed.analytics-demo.project-code=${APP_SEED_ANALYTICS_DEMO_PROJECT_CODE:C9-A2-M9}
app.seed.analytics-demo.project-id=${APP_SEED_ANALYTICS_DEMO_PROJECT_ID:0}

# Local H2 task alert fixtures; seeded once without resetting edited tasks.
app.task-alert.demo.enabled=${TASK_ALERT_DEMO_ENABLED:true}
app.notification-demo.student.enabled=${NOTIFICATION_DEMO_STUDENT_ENABLED:true}
app.notification-demo.student.email=${NOTIFICATION_DEMO_STUDENT_EMAIL:notification.student.demo@example.test}
app.notification-demo.student.password=${NOTIFICATION_DEMO_STUDENT_PASSWORD:Demo@123}
app.notification-demo.student.class-code=${NOTIFICATION_DEMO_STUDENT_CLASS_CODE:DEMO-JAVA-26-01}

# Inactivity reminder policy. Legacy audit timestamps use the server zone unless configured.
app.member-reminder.inactive-days=${MEMBER_REMINDER_INACTIVE_DAYS:7}
app.member-reminder.cooldown-seconds=${MEMBER_REMINDER_COOLDOWN_SECONDS:86400}
app.member-reminder.audit-time-zone=${MEMBER_REMINDER_AUDIT_TIME_ZONE:}
app.member-reminder.demo.enabled=${MEMBER_REMINDER_DEMO_ENABLED:true}

# In-app deadline notifications. Team backlog dates are stored as local datetimes.
app.notification.deadline-check-ms=${APP_NOTIFICATION_DEADLINE_CHECK_MS:60000}
app.notification.milestone-warning-hours=${APP_NOTIFICATION_MILESTONE_WARNING_HOURS:48}
app.notification.backlog-time-zone=${APP_NOTIFICATION_BACKLOG_TIME_ZONE:Asia/Ho_Chi_Minh}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=npsdn1906@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Q&A email notifications (new question -> instructor, answer -> asker)
app.qna.email-notifications-enabled=${QNA_EMAIL_NOTIFICATIONS_ENABLED:true}

# JWT Configuration
jwt.access-token.duration=${JWT_ACCESS_TOKEN_DURATION:3600}
jwt.refresh-token.duration=${JWT_REFRESH_TOKEN_DURATION:604800}
jwt.refresh-token.short-duration=${JWT_REFRESH_TOKEN_SHORT_DURATION:86400}
jwt.password-one-time-token.duration=${JWT_ONE_TIME_TOKEN_DURATION:900}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}
app.auth.sso.jit-provisioning-enabled=${AUTH_SSO_JIT_PROVISIONING_ENABLED:true}
app.auth.max-active-sessions=${AUTH_MAX_ACTIVE_SESSIONS:5}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Swagger Configuration
swagger.server-url=http://localhost:8080
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.default-model-rendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.oauth.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
springdoc.swagger-ui.oauth.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
springdoc.swagger-ui.oauth.scopes=email,profile
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# CORS Configuration
app.frontend-domain=${APP_FRONTEND_DOMAIN:http://localhost:5173}
app.backend-domain=${APP_BACKEND_DOMAIN:http://localhost:8080}

# Seed data for testing - bulk students
# Số lượng user role STUDENT được tạo tự động khi khởi động backend.
# Dùng để test tạo invitation hàng loạt. Set = 0 để tắt.
app.seed.bulk-students.count=${BULK_STUDENTS_COUNT:30}
app.seed.bulk-students.password=${BULK_STUDENTS_PASSWORD:password123}

# Seed dữ liệu demo cho trang Course Analytics (enrollment, progress, review, report, Q&A).
# Mặc định BẬT để mọi thành viên chạy backend là có sẵn dữ liệu để test.
# Tắt bằng APP_SEED_COURSE_ANALYTICS_ENABLED=false.
app.seed.course-analytics.enabled=${APP_SEED_COURSE_ANALYTICS_ENABLED:true}
# Số học viên seed cho các khóa học KHÔNG có profile riêng (khóa demo chính luôn dùng số lượng cố định).
app.seed.course-analytics.learners-per-course=${APP_SEED_ANALYTICS_LEARNERS_PER_COURSE:50}

# Milestone local mock data
milestone.mock.seed-enabled=${MILESTONE_MOCK_SEED_ENABLED:false}
milestone.submission.mock.seed-enabled=${MILESTONE_SUBMISSION_MOCK_SEED_ENABLED:false}
milestone.project-scope-backfill.enabled=${MILESTONE_PROJECT_SCOPE_BACKFILL_ENABLED:true}
milestone.mock.tenant-time-zone=${MILESTONE_MOCK_TENANT_TIME_ZONE:Asia/Ho_Chi_Minh}
milestone.mock.submission.assignments=${MILESTONE_MOCK_SUBMISSION_ASSIGNMENTS:student@example.com=1}
milestone.mock.submission.team-assignments=${MILESTONE_MOCK_SUBMISSION_TEAM_ASSIGNMENTS:student@example.com=1}
milestone.mock.submission.reviewer-team-assignments=${MILESTONE_MOCK_SUBMISSION_REVIEWER_TEAM_ASSIGNMENTS:teacher@example.com=1,admin@example.com=1+3}
team.artifact.submission.demo-seed.enabled=${TEAM_ARTIFACT_SUBMISSION_DEMO_SEED_ENABLED:false}
team.artifact.submission.demo-seed.team-id=${TEAM_ARTIFACT_SUBMISSION_DEMO_TEAM_ID:3}

# Secure artifact upload remains closed until MIME, size, private storage and clamd are configured.
app.artifact.upload.enabled=${ARTIFACT_UPLOAD_ENABLED:false}
app.artifact.upload.max-bytes=${ARTIFACT_UPLOAD_MAX_BYTES:0}
app.artifact.upload.allowed-mime-types=${ARTIFACT_UPLOAD_ALLOWED_MIME_TYPES:}
app.artifact.upload.storage-path=${ARTIFACT_UPLOAD_STORAGE_PATH:./data/artifact-uploads}
app.artifact.upload.clamav-host=${ARTIFACT_CLAMAV_HOST:}
app.artifact.upload.clamav-port=${ARTIFACT_CLAMAV_PORT:3310}
app.artifact.upload.clamav-timeout-millis=${ARTIFACT_CLAMAV_TIMEOUT_MILLIS:5000}

# US-RES-001: template resource upload (links + documents on a template version)
app.template-resource.upload.max-bytes=${TEMPLATE_RESOURCE_UPLOAD_MAX_BYTES:26214400}
app.template-resource.upload.storage-path=${TEMPLATE_RESOURCE_UPLOAD_STORAGE_PATH:./data/template-resource-uploads}

# US-RES-004: short-lived signed download links for project resources.
# Leave the secret empty locally (a random key is generated per boot).
app.resource-download.secret=${RESOURCE_DOWNLOAD_SECRET:}
app.resource-download.ttl-seconds=${RESOURCE_DOWNLOAD_TTL_SECONDS:300}

# The servlet limit must cover the largest accepted upload (template resources: 25 MB).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:32MB}

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Lesson Q&A limits
app.qna.cooldown-seconds=15
app.qna.max-questions-per-day=30

# Lesson Q&A limits
app.qna.cooldown-seconds=15
app.qna.max-questions-per-day=30


# External API Configuration (Hệ thống tổng)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://localhost:9090}
# Explicitly identify a sample upstream even if it does not send X-Data-Source: sample.
external.api.sample-data=${EXTERNAL_API_SAMPLE_DATA:true}
external.api.token=${EXTERNAL_API_TOKEN:}
external.api.connect-timeout=${EXTERNAL_API_CONNECT_TIMEOUT:5000}
external.api.read-timeout=${EXTERNAL_API_READ_TIMEOUT:10000}
# Invitation & Reminder Scheduling ---
app.reminder.interval-ms=${REMINDER_INTERVAL_MS:60000}
app.invitation.expiry-interval-ms=${INVITATION_EXPIRY_INTERVAL_MS:300000}
app.anonymous.cleanup-cron=${ANONYMOUS_CLEANUP_CRON:0 0 3 * * *}
app.anonymous.session-ttl-hours=${ANONYMOUS_SESSION_TTL_HOURS:24}
app.anonymous.retention-days=${ANONYMOUS_RETENTION_DAYS:30}

# AI-Assisted Essay Grading Configuration (Google Gemini API)
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
app.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
app.ai.endpoint=${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:120}

# Judge0 (cham bai coding)
code.judge.url=${JUDGE0_URL:http://localhost:2358}
code.judge.token=${JUDGE0_TOKEN:}
code.judge.memory-limit-kb=${JUDGE0_MEMORY_LIMIT_KB:12000000}

app.seed.syllabuses.enabled=${SYLLABUS_SEED_ENABLED:true}

# GitHub App integration (Git Integration module).
# Secrets come only from env vars / a key file outside the repo; never commit them.
# The key file path should point outside the repository, e.g. ~/.secrets/github-app.pem.
app.github.enabled=${GITHUB_APP_ENABLED:false}
app.github.app-id=${GITHUB_APP_ID:}
app.github.app-slug=${GITHUB_APP_SLUG:}
app.github.client-id=${GITHUB_APP_CLIENT_ID:}
app.github.client-secret=${GITHUB_APP_CLIENT_SECRET:}
app.github.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
app.github.private-key=${GITHUB_APP_PRIVATE_KEY:}
app.github.webhook-secret=${GITHUB_APP_WEBHOOK_SECRET:}
# Frontend route GitHub redirects to after install + user authorization. The page forwards
# code/installation_id/state to the backend with the user's Bearer token.
# Must exactly match "Callback URL" in the GitHub App settings.
app.github.callback-url=${GITHUB_APP_CALLBACK_URL:${app.frontend-domain}/git-integration/github/callback}
app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
app.github.web-base-url=${GITHUB_WEB_BASE_URL:https://github.com}
app.github.state-ttl-seconds=${GITHUB_APP_STATE_TTL_SECONDS:600}
app.github.repository-cache-ttl-seconds=${GITHUB_REPOSITORY_CACHE_TTL_SECONDS:300}
app.github.repository-max-pages=${GITHUB_REPOSITORY_MAX_PAGES:10}
# GI-04: repository synchronization jobs (initial sync after linking a repository).
app.github.sync-max-attempts=${GITHUB_SYNC_MAX_ATTEMPTS:3}
app.github.sync-stuck-after-minutes=${GITHUB_SYNC_STUCK_AFTER_MINUTES:10}
app.github.sync-max-branch-pages=${GITHUB_SYNC_MAX_BRANCH_PAGES:10}
app.github.sync-poll-interval-ms=${GITHUB_SYNC_POLL_INTERVAL_MS:60000}
# SY-01: commit history import (GraphQL) and the periodic reconcile (one instance at a time, ShedLock).
app.github.sync-commit-page-size=${GITHUB_SYNC_COMMIT_PAGE_SIZE:100}
app.github.sync-max-pages-per-run=${GITHUB_SYNC_MAX_PAGES_PER_RUN:50}
app.github.sync-rate-limit-reserve=${GITHUB_SYNC_RATE_LIMIT_RESERVE:100}
app.github.sync-reconcile-enabled=${GITHUB_SYNC_RECONCILE_ENABLED:true}
app.github.sync-reconcile-cron=${GITHUB_SYNC_RECONCILE_CRON:0 0 */6 * * *}
# SY-03: GitHub webhooks (POST /api/webhooks/github). Needs GITHUB_APP_WEBHOOK_SECRET; without it the endpoint answers 503.
# SY-04: retries after the first failed run (backoff 1m, 5m, 15m, 1h, 6h), then FAILED.
app.github.webhook-max-retries=${GITHUB_WEBHOOK_MAX_RETRIES:5}
# SY-04: the fallback scheduler takes a RECEIVED event only after this grace period (fast path first).
app.github.webhook-received-grace-seconds=${GITHUB_WEBHOOK_RECEIVED_GRACE_SECONDS:10}
app.github.webhook-worker-core=${GITHUB_WEBHOOK_WORKER_CORE:2}
app.github.webhook-worker-max=${GITHUB_WEBHOOK_WORKER_MAX:4}
app.github.webhook-queue-capacity=${GITHUB_WEBHOOK_QUEUE_CAPACITY:200}
# SY-04: cap on GitHub pages (100 commits each) read to complete a push whose payload was truncated.
app.github.push-max-api-pages=${GITHUB_PUSH_MAX_API_PAGES:50}

# SY-05 step 0: Task IDs of backlog items (FA-12). Safety-net job that keys items saved without one.
app.backlog.task-key-backfill-interval-ms=${BACKLOG_TASK_KEY_BACKFILL_INTERVAL_MS:600000}
# SY-05: link commits / pull requests to tasks. The sweeper processes what the fast path missed and backfills old commits.
app.github.task-link-sweep-enabled=${GITHUB_TASK_LINK_SWEEP_ENABLED:true}
app.github.task-link-sweep-interval-ms=${GITHUB_TASK_LINK_SWEEP_INTERVAL_MS:300000}
app.github.task-link-sweep-initial-delay-ms=${GITHUB_TASK_LINK_SWEEP_INITIAL_DELAY_MS:60000}
app.github.webhook-payload-retention-days=${GITHUB_WEBHOOK_PAYLOAD_RETENTION_DAYS:15}
app.github.webhook-stuck-after-minutes=${GITHUB_WEBHOOK_STUCK_AFTER_MINUTES:10}
app.github.webhook-poll-interval-ms=${GITHUB_WEBHOOK_POLL_INTERVAL_MS:30000}
app.github.webhook-retention-cron=${GITHUB_WEBHOOK_RETENTION_CRON:0 30 3 * * *}

# AI Template Assistant - Gemini Configuration
# AI Template Assistant - Gemini Configuration
app.ai.template-assistant.gemini.api-key=${TEMPLATE_ASSISTANT_GEMINI_API_KEY:}
app.ai.template-assistant.gemini.model=${TEMPLATE_ASSISTANT_GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.template-assistant.gemini.base-url=${TEMPLATE_ASSISTANT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.template-assistant.gemini.timeout-seconds=${TEMPLATE_ASSISTANT_GEMINI_TIMEOUT_SECONDS:45}
