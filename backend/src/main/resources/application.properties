
# Application Name
spring.application.name=starter_project_2025
server.port=8080

# Database Configuration ---
spring.datasource.url=jdbc:h2:file:./data/base_crud;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=npsdn1906@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Configuration
jwt.access-token.duration=${JWT_ACCESS_TOKEN_DURATION:3600}
jwt.refresh-token.duration=${JWT_REFRESH_TOKEN_DURATION:604800}
jwt.password-one-time-token.duration=${JWT_ONE_TIME_TOKEN_DURATION:900}


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Swagger Configuration
swagger.server-url=http://localhost:8080
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.default-model-rendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.oauth.client-id=${GOOGLE_CLIENT_ID}
springdoc.swagger-ui.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
springdoc.swagger-ui.oauth.scopes=email,profile
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# CORS Configuration
app.frontend-domain=${APP_FRONTEND_DOMAIN:http://localhost:5173}
app.backend-domain=${APP_BACKEND_DOMAIN:http://localhost:8080}

# Seed data for testing - bulk students
# Số lượng user role STUDENT được tạo tự động khi khởi động backend.
# Dùng để test tạo invitation hàng loạt. Set = 0 để tắt.
app.seed.bulk-students.count=30
app.seed.bulk-students.password=password123

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
# External API Configuration (Hệ thống tổng)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://localhost:9090}
external.api.token=${EXTERNAL_API_TOKEN:}
external.api.connect-timeout=${EXTERNAL_API_CONNECT_TIMEOUT:5000}
external.api.read-timeout=${EXTERNAL_API_READ_TIMEOUT:10000}

# Invitation & Reminder Scheduling ---
app.reminder.interval-ms=${REMINDER_INTERVAL_MS:60000}
app.invitation.expiry-interval-ms=${INVITATION_EXPIRY_INTERVAL_MS:300000}
app.anonymous.cleanup-cron=${ANONYMOUS_CLEANUP_CRON:0 0 3 * * *}
app.anonymous.session-ttl-hours=${ANONYMOUS_SESSION_TTL_HOURS:24}
app.anonymous.retention-days=${ANONYMOUS_RETENTION_DAYS:30}

# AI-Assisted Essay Grading Configuration (Google Gemini API)
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
app.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
app.ai.endpoint=${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:45}


#Import image from device
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
