# Application Name
spring.application.name=starter_project_2025
server.port=8080
# Allow a short migration window for access tokens issued before JWT claims
# were compacted. New ADMIN tokens stay well below this limit.
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:32KB}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n

# Database Configuration ---
# The previous local H2 schema used UUID project/tenant keys. Keep it intact and
# start this Long-key schema in a separate local database unless DB_URL is set.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fams_lms_after_merge}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# Local H2 acceptance fixtures; disable with WORKSPACE_DEMO_ENABLED=false.
app.seed.board.enabled=${APP_SEED_BOARD_ENABLED:true}
app.seed.team-allocation.enabled=${TEAM_ALLOCATION_DEMO_SEED_ENABLED:true}
# Opt-in US-PRJ-001 search/preview fixtures; never changes existing templates.
app.seed.us-prj-001.enabled=${US_PRJ_001_DEMO_SEED_ENABLED:false}
app.workspace.demo.enabled=${WORKSPACE_DEMO_ENABLED:true}

# Local H2 task alert fixtures; seeded once without resetting edited tasks.
app.task-alert.demo.enabled=${TASK_ALERT_DEMO_ENABLED:true}

# Inactivity reminder policy. Legacy audit timestamps use the server zone unless configured.
app.member-reminder.inactive-days=${MEMBER_REMINDER_INACTIVE_DAYS:7}
app.member-reminder.cooldown-seconds=${MEMBER_REMINDER_COOLDOWN_SECONDS:86400}
app.member-reminder.audit-time-zone=${MEMBER_REMINDER_AUDIT_TIME_ZONE:}
app.member-reminder.demo.enabled=${MEMBER_REMINDER_DEMO_ENABLED:true}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=npsdn1906@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.access-token.duration=${JWT_ACCESS_TOKEN_DURATION:3600}
jwt.refresh-token.duration=${JWT_REFRESH_TOKEN_DURATION:604800}
jwt.password-one-time-token.duration=${JWT_ONE_TIME_TOKEN_DURATION:900}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Swagger Configuration
swagger.server-url=http://localhost:8080
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.default-model-rendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.oauth.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
springdoc.swagger-ui.oauth.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
springdoc.swagger-ui.oauth.scopes=email,profile
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# CORS Configuration
app.frontend-domain=${APP_FRONTEND_DOMAIN:http://localhost:5173}
app.backend-domain=${APP_BACKEND_DOMAIN:http://localhost:8080}

# Milestone local mock data
milestone.mock.seed-enabled=${MILESTONE_MOCK_SEED_ENABLED:false}
milestone.submission.mock.seed-enabled=${MILESTONE_SUBMISSION_MOCK_SEED_ENABLED:false}
milestone.project-scope-backfill.enabled=${MILESTONE_PROJECT_SCOPE_BACKFILL_ENABLED:true}
milestone.mock.tenant-time-zone=${MILESTONE_MOCK_TENANT_TIME_ZONE:Asia/Ho_Chi_Minh}
milestone.mock.submission.assignments=${MILESTONE_MOCK_SUBMISSION_ASSIGNMENTS:student@example.com=1}
milestone.mock.submission.team-assignments=${MILESTONE_MOCK_SUBMISSION_TEAM_ASSIGNMENTS:student@example.com=1}
milestone.mock.submission.reviewer-team-assignments=${MILESTONE_MOCK_SUBMISSION_REVIEWER_TEAM_ASSIGNMENTS:teacher@example.com=1,admin@example.com=1+3}
team.artifact.submission.demo-seed.enabled=${TEAM_ARTIFACT_SUBMISSION_DEMO_SEED_ENABLED:false}
team.artifact.submission.demo-seed.team-id=${TEAM_ARTIFACT_SUBMISSION_DEMO_TEAM_ID:3}

# Secure artifact upload remains closed until MIME, size, private storage and clamd are configured.
app.artifact.upload.enabled=${ARTIFACT_UPLOAD_ENABLED:false}
app.artifact.upload.max-bytes=${ARTIFACT_UPLOAD_MAX_BYTES:0}
app.artifact.upload.allowed-mime-types=${ARTIFACT_UPLOAD_ALLOWED_MIME_TYPES:}
app.artifact.upload.storage-path=${ARTIFACT_UPLOAD_STORAGE_PATH:./data/artifact-uploads}
app.artifact.upload.clamav-host=${ARTIFACT_CLAMAV_HOST:}
app.artifact.upload.clamav-port=${ARTIFACT_CLAMAV_PORT:3310}
app.artifact.upload.clamav-timeout-millis=${ARTIFACT_CLAMAV_TIMEOUT_MILLIS:5000}

# US-RES-001: template resource upload (links + documents on a template version)
app.template-resource.upload.max-bytes=${TEMPLATE_RESOURCE_UPLOAD_MAX_BYTES:26214400}
app.template-resource.upload.storage-path=${TEMPLATE_RESOURCE_UPLOAD_STORAGE_PATH:./data/template-resource-uploads}

# US-RES-004: short-lived signed download links for project resources.
# Leave the secret empty locally (a random key is generated per boot).
app.resource-download.secret=${RESOURCE_DOWNLOAD_SECRET:}
app.resource-download.ttl-seconds=${RESOURCE_DOWNLOAD_TTL_SECONDS:300}

# The servlet limit must cover the largest accepted upload (template resources: 25 MB).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:32MB}

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false    

# External API Configuration (H? th?ng t?ng)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://localhost:9090}
external.api.token=${EXTERNAL_API_TOKEN:}
external.api.connect-timeout=${EXTERNAL_API_CONNECT_TIMEOUT:5000}
external.api.read-timeout=${EXTERNAL_API_READ_TIMEOUT:10000}
