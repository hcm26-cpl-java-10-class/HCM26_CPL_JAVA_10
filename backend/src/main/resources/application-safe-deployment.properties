# Preservation-first startup for an existing database. Specify the exact reviewed
# datasource URL explicitly, with IFEXISTS=TRUE for H2 file databases.
# No schema update or data/RBAC initialization is performed by this profile.
app.startup.mutations-enabled=false
app.scheduling.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Automatic background jobs stay paused during cutover verification. Re-enable
# app.scheduling.enabled only after reviewing pending outbox/cleanup/deadline work.
# Controllers, repositories, security and normal service operations remain active.
