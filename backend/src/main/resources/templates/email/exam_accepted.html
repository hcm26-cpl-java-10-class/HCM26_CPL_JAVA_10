<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đã xác nhận lời mời</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background:#f7f8fa; padding:16px;">
<div style="max-width: 620px; margin: 0 auto; background:#ffffff; padding: 28px; border-radius: 10px; border:1px solid #e5e7eb;">
    <div style="background:#dcfce7; border-left:4px solid #16a34a; padding:12px 16px; border-radius:6px; margin-bottom:20px;">
        <strong style="color:#166534;">✔ Đã xác nhận thành công</strong>
    </div>

    <h2 style="color:#2c3e50; margin-top:0;">Bạn đã xác nhận lời mời</h2>

    <p>Xin chào <strong th:text="${username}">Học sinh</strong>,</p>
    <p>
        Bạn đã xác nhận tham gia kỳ thi <strong th:text="${examTitle}">Tên kỳ thi</strong>.
        Kỳ thi bắt đầu lúc <strong th:text="${startTime}">--/--/---- --:--</strong>.
    </p>

    <div style="text-align:center; margin:26px 0;">
        <a th:href="${examLink}"
           style="background:#2563eb; color:#ffffff; padding:12px 28px; border-radius:6px;
                  text-decoration:none; display:inline-block; font-weight:600;">
            Xem danh sách kỳ thi
        </a>
    </div>

    <p style="font-size:0.9em; color:#6b7280;">
        Chúc bạn làm bài tốt!
    </p>

    <p style="margin-top: 30px; font-size: 0.9em; color: #777;">Trân trọng,<br>Hệ thống Quản lý Kỳ thi</p>
</div>
</body>
</html>
