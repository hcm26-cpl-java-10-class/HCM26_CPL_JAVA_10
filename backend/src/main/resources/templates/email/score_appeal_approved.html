<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Score Appeal Approved</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background:#f7f8fa; padding:16px;">
<div style="max-width: 620px; margin: 0 auto; background:#ffffff; padding: 28px; border-radius: 10px; border:1px solid #e5e7eb;">
    <h2 style="color:#166534; margin-top:0;">Score Appeal Approved</h2>

    <p>Hello <strong th:text="${username}">Student</strong>,</p>
    <p>
        Your score appeal for <strong th:text="${examTitle}">Exam</strong> has been approved.
    </p>

    <table style="width:100%; border-collapse:collapse; margin:18px 0;">
        <tr>
            <td style="padding:8px 10px; background:#f3f4f6; width:170px;">Previous Score</td>
            <td style="padding:8px 10px;"><strong th:text="${oldScore}">--</strong></td>
        </tr>
        <tr>
            <td style="padding:8px 10px; background:#f3f4f6;">Updated Score</td>
            <td style="padding:8px 10px;"><strong th:text="${newScore}">--</strong></td>
        </tr>
        <tr>
            <td style="padding:8px 10px; background:#f3f4f6;">Reviewer Note</td>
            <td style="padding:8px 10px;" th:text="${note}">--</td>
        </tr>
    </table>

    <p style="margin-top: 30px; font-size: 0.9em; color: #777;">Best regards,<br>Exam Management System</p>
</div>
</body>
</html>
