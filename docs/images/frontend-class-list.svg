  <rect x="12" y="105" width="196" height="36" rx="6" fill="#eff6ff"/>
  <text x="44" y="128" fill="#2563eb" font-size="13" font-weight="bold">Class</text>
  <circle cx="28" cy="123" r="4" fill="#2563eb"/>
