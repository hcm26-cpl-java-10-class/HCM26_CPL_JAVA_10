  <rect x="600" y="155" width="140" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="615" y="179" fill="#334155" font-size="13">Status: All (5) ▾</text>
  <rect x="1050" y="155" width="110" height="38" rx="6" fill="#2563eb"/>
  <text x="1068" y="179" fill="#ffffff" font-size="13" font-weight="bold">+ Add Class</text>

  <g transform="translate(260, 210)">
    <rect x="0" y="0" width="900" height="420" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="900" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="25" fill="#64748b" font-size="12" font-weight="bold">CLASS CODE</text>
    <text x="190" y="25" fill="#64748b" font-size="12" font-weight="bold">CLASS NAME</text>
    <text x="440" y="25" fill="#64748b" font-size="12" font-weight="bold">CLASS ADMIN</text>
    <text x="610" y="25" fill="#64748b" font-size="12" font-weight="bold">MASTER TRAINER</text>
    <text x="760" y="25" fill="#64748b" font-size="12" font-weight="bold">STATUS</text>
    <text x="850" y="25" fill="#64748b" font-size="12" font-weight="bold">ACTION</text>

    <rect x="0" y="40" width="900" height="56" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="20" y="74" fill="#0f172a" font-size="13" font-family="monospace" font-weight="bold">HCM26_CA_JAVA_01</text>
    <text x="190" y="74" fill="#2563eb" font-size="13" font-weight="600" cursor="pointer">Lớp Chuyên sâu Java Backend K26</text>
    <text x="440" y="74" fill="#334155" font-size="13">Nguyễn Văn Admin</text>
    <text x="610" y="74" fill="#334155" font-size="13">Lê Minh Hoàng</text>
    <rect x="755" y="60" width="75" height="22" rx="4" fill="#fef3c7"/>
    <text x="768" y="75" fill="#92400e" font-size="11" font-weight="bold">Planning</text>
    <text x="850" y="74" fill="#2563eb" font-size="13" cursor="pointer">Details ▾</text>

    <rect x="0" y="96" width="900" height="56" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="20" y="130" fill="#0f172a" font-size="13" font-family="monospace" font-weight="bold">HCM26_FR_DOTNET_01</text>
    <text x="190" y="130" fill="#2563eb" font-size="13" font-weight="600" cursor="pointer">Lớp Fullstack .NET Core Web K26</text>
    <text x="440" y="130" fill="#334155" font-size="13">Nguyễn Văn Admin</text>
    <text x="610" y="130" fill="#334155" font-size="13">Trần Văn Hùng</text>
    <rect x="755" y="116" width="75" height="22" rx="4" fill="#fef3c7"/>
    <text x="768" y="131" fill="#92400e" font-size="11" font-weight="bold">Planning</text>
    <text x="850" y="130" fill="#2563eb" font-size="13" cursor="pointer">Details ▾</text>
