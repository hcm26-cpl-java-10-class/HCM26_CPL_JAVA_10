  <text x="44" y="248" fill="#475569" font-size="13">Training Programs</text>

  <text x="260" y="105" fill="#0f172a" font-size="22" font-weight="bold">Class Management</text>
  <text x="260" y="130" fill="#64748b" font-size="13">Quản lý danh sách lớp học đào tạo, kiểm tra tính sẵn sàng và điều phối vận hành lớp</text>
  
  <rect x="260" y="155" width="320" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
