<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="20" y="12" width="32" height="32" rx="6" fill="#2563eb"/>
  <text x="27" y="34" fill="#ffffff" font-size="18" font-weight="bold">F</text>
  <text x="62" y="34" fill="#0f172a" font-size="16" font-weight="bold">FAMS Training Platform</text>
  <text x="260" y="34" fill="#64748b" font-size="13">Training Operations / <tspan fill="#0f172a" font-weight="600">Class Management</tspan></text>
  
  <rect x="0" y="56" width="220" height="644" fill="#ffffff" stroke="#e2e8f0"/>
