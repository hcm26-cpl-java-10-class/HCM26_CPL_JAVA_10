<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="34" fill="#0f172a" font-size="16" font-weight="bold">FAMS Training Platform</text>
  <text x="240" y="34" fill="#64748b" font-size="13">Class / HCM26_CA_JAVA_01 / <tspan fill="#0f172a" font-weight="bold">Calendar &amp; Timetable</tspan></text>

  <g transform="translate(60, 75)">
    <text x="0" y="25" fill="#0f172a" font-size="20" font-weight="bold">Weekly Timetable Schedule (Lịch học theo tuần)</text>
    <rect x="860" y="5" width="100" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="880" y="26" fill="#334155" font-size="12">October 2026 ▾</text>
    <rect x="980" y="5" width="100" height="32" rx="4" fill="#2563eb"/>
    <text x="998" y="26" fill="#ffffff" font-size="12" font-weight="bold">+ Add Slot</text>

    <!-- Calendar Grid Table -->
    <rect x="0" y="60" width="1080" height="500" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="60" width="1080" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="85" fill="#64748b" font-size="12" font-weight="bold">TIME SLOT</text>
    <text x="160" y="85" fill="#64748b" font-size="12" font-weight="bold">MON (05/10)</text>
    <text x="340" y="85" fill="#64748b" font-size="12" font-weight="bold">TUE (06/10)</text>
    <text x="520" y="85" fill="#64748b" font-size="12" font-weight="bold">WED (07/10)</text>
    <text x="700" y="85" fill="#64748b" font-size="12" font-weight="bold">THU (08/10)</text>
    <text x="880" y="85" fill="#64748b" font-size="12" font-weight="bold">FRI (09/10)</text>

    <!-- Morning Slot -->
    <rect x="0" y="100" width="1080" height="180" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="20" y="140" fill="#0f172a" font-size="12" font-weight="bold">Morning</text>
    <text x="20" y="160" fill="#64748b" font-size="11">08:30 - 11:45</text>

    <!-- Mon Card -->
    <rect x="150" y="110" width="160" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="160" y="132" fill="#1e40af" font-size="12" font-weight="bold">Java Core Day 1</text>
    <text x="160" y="152" fill="#334155" font-size="11">Trainer: Lê Minh Hoàng</text>
    <text x="160" y="172" fill="#64748b" font-size="11">Room: Lab 204</text>
    <rect x="160" y="225" width="60" height="20" rx="3" fill="#2563eb"/>
    <text x="172" y="239" fill="#ffffff" font-size="10" font-weight="bold">Normal</text>

    <!-- Wed Card -->
    <rect x="510" y="110" width="160" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="520" y="132" fill="#1e40af" font-size="12" font-weight="bold">Java Core Day 2</text>
    <text x="520" y="152" fill="#334155" font-size="11">Trainer: Lê Minh Hoàng</text>
    <text x="520" y="172" fill="#64748b" font-size="11">Room: Lab 204</text>
    <rect x="520" y="225" width="60" height="20" rx="3" fill="#2563eb"/>
    <text x="532" y="239" fill="#ffffff" font-size="10" font-weight="bold">Normal</text>

    <!-- Fri Card -->
    <rect x="870" y="110" width="160" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="880" y="132" fill="#1e40af" font-size="12" font-weight="bold">Java Core Day 3</text>
    <text x="880" y="152" fill="#334155" font-size="11">Trainer: Lê Minh Hoàng</text>
    <text x="880" y="172" fill="#64748b" font-size="11">Room: Lab 204</text>
    <rect x="880" y="225" width="60" height="20" rx="3" fill="#2563eb"/>
    <text x="892" y="239" fill="#ffffff" font-size="10" font-weight="bold">Normal</text>
