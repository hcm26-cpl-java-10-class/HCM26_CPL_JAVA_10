<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="0" y="0" width="1100" height="35" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="20" y="23" fill="#3b4151" font-size="13" font-weight="bold">Parameters</text>
  <text x="500" y="23" fill="#3b4151" font-size="13" font-weight="bold">Description</text>

  <!-- Path param id -->
  <text x="20" y="60" fill="#3b4151" font-size="13" font-weight="bold">id</text>
  <text x="35" y="60" fill="#ff4d4f" font-size="12">* required</text>
  <text x="20" y="78" fill="#888888" font-size="11">integer (path)</text>
  <rect x="500" y="48" width="570" height="32" rx="4" fill="#ffffff" stroke="#cccccc"/>
  <text x="515" y="69" fill="#333333" font-size="12">15</text>

  <!-- Body param -->
  <text x="20" y="115" fill="#3b4151" font-size="13" font-weight="bold">body</text>
  <text x="55" y="115" fill="#ff4d4f" font-size="12">* required</text>
  <text x="20" y="133" fill="#888888" font-size="11">SubjectSyllabusDTO</text>
  
  <rect x="500" y="95" width="570" height="110" rx="4" fill="#ffffff" stroke="#3b4151" stroke-width="1.5"/>
  <text x="515" y="115" fill="#333333" font-size="11.5" font-family="Consolas, monospace">{ "passScore": "6.0", "assessmentScheme": [</text>
  <text x="530" y="133" fill="#333333" font-size="11.5" font-family="Consolas, monospace">  { "category": "Quiz", "weight": 15 }, { "category": "Assignment", "weight": 25 },</text>
  <text x="530" y="151" fill="#333333" font-size="11.5" font-family="Consolas, monospace">  { "category": "Practical Exam", "weight": 30 }, { "category": "Final Exam", "weight": 30 }</text>
  <text x="515" y="169" fill="#333333" font-size="11.5" font-family="Consolas, monospace">] }</text>

  <!-- Execute & Clear Buttons -->
  <rect x="20" y="215" width="530" height="34" rx="4" fill="#4990e2"/>
  <text x="250" y="237" fill="#ffffff" font-size="13" font-weight="bold">Execute</text>
  <rect x="560" y="215" width="510" height="34" rx="4" fill="#f7f7f7" stroke="#cccccc"/>
  <text x="800" y="237" fill="#555555" font-size="13">Clear</text>

  <text x="20" y="280" fill="#3b4151" font-size="14" font-weight="bold">Responses</text>

  <!-- Curl Section -->
  <text x="20" y="305" fill="#666666" font-size="12" font-weight="bold">Curl</text>
  <rect x="20" y="315" width="1050" height="42" rx="4" fill="#292d3e"/>
  <text x="32" y="340" fill="#00ff66" font-size="11.5" font-family="Consolas, monospace">curl -X 'PUT' 'http://localhost:8080/api/subjects/15/syllabus' -H 'accept: */*' -H 'Content-Type: application/json' -d '{"passScore":"6.0","assessmentScheme":[...]}'</text>

  <!-- Request URL Section -->
  <text x="20" y="380" fill="#666666" font-size="12" font-weight="bold">Request URL</text>
  <rect x="20" y="390" width="1050" height="30" rx="4" fill="#292d3e"/>
  <text x="32" y="410" fill="#ffffff" font-size="12" font-family="Consolas, monospace">http://localhost:8080/api/subjects/15/syllabus</text>

  <!-- Server Response Section -->
  <text x="20" y="445" fill="#3b4151" font-size="13" font-weight="bold">Server response</text>
  <text x="20" y="470" fill="#666666" font-size="12">Code</text>
  <text x="120" y="470" fill="#666666" font-size="12">Details</text>

  <text x="20" y="500" fill="#3b4151" font-size="13" font-weight="bold">200</text>

  <!-- Response Body Box with Copy & Download -->
  <text x="120" y="495" fill="#888888" font-size="11">Response body</text>
  <rect x="120" y="505" width="950" height="195" rx="4" fill="#292d3e"/>
  
  <rect x="940" y="515" width="55" height="22" rx="3" fill="#3f445b"/>
  <text x="952" y="530" fill="#ffffff" font-size="11">Copy</text>
  <rect x="1002" y="515" width="58" height="22" rx="3" fill="#3f445b"/>
  <text x="1008" y="530" fill="#ffffff" font-size="11">Download</text>

  <text x="135" y="530" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">{</text>
  <text x="150" y="548" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"status"</tspan>: <tspan fill="#c3e88d">"SUCCESS"</tspan>,</text>
  <text x="150" y="566" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"message"</tspan>: <tspan fill="#c3e88d">"Cập nhật Assessment Scheme thành công (Tổng: 100%)"</tspan>,</text>
  <text x="150" y="584" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"data"</tspan>: {</text>
  <text x="170" y="602" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">    <tspan fill="#80cbc4">"subjectId"</tspan>: <tspan fill="#f78c6c">15</tspan>,</text>
  <text x="170" y="620" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">    <tspan fill="#80cbc4">"totalWeight"</tspan>: <tspan fill="#f78c6c">100</tspan>,</text>
  <text x="170" y="638" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">    <tspan fill="#80cbc4">"schemeCount"</tspan>: <tspan fill="#f78c6c">4</tspan></text>
  <text x="150" y="656" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  }</text>
  <text x="135" y="674" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">}</text>

  <!-- Response Headers -->
  <text x="120" y="720" fill="#888888" font-size="11">Response headers</text>
  <rect x="120" y="730" width="950" height="95" rx="4" fill="#292d3e"/>
  <text x="135" y="750" fill="#d1d5db" font-size="11" font-family="Consolas, monospace">cache-control: no-cache, no-store, max-age=0, must-revalidate</text>
  <text x="135" y="768" fill="#d1d5db" font-size="11" font-family="Consolas, monospace">content-type: application/json;charset=UTF-8</text>
  <text x="135" y="786" fill="#d1d5db" font-size="11" font-family="Consolas, monospace">date: Mon, 23 Nov 2026 10:48:30 GMT</text>
</svg>