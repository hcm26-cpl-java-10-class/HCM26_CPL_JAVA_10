  <text x="150" y="566" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"code"</tspan>: <tspan fill="#c3e88d">"JAVA_CORE_26"</tspan>,</text>
  <text x="150" y="584" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"name"</tspan>: <tspan fill="#c3e88d">"Lập trình Java Core &amp; OOP nâng cao"</tspan>,</text>
