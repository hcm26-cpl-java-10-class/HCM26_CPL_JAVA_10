  <text x="150" y="674" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"createdAt"</tspan>: <tspan fill="#c3e88d">"2026-11-23T10:45:10.124Z"</tspan></text>
