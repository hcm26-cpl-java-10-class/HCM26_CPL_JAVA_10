  <text x="150" y="620" fill="#ffffff" font-size="11.5" font-family="Consolas, monospace">  <tspan fill="#80cbc4">"technicalGroup"</tspan>: <tspan fill="#c3e88d">"Java Backend"</tspan>,</text>
