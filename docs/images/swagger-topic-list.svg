<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" style="background:#f7f9fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="0" y="0" width="1200" height="60" fill="#1b1b1b"/>
  <text x="30" y="38" fill="#89bf04" font-size="24" font-weight="bold" font-family="'Courier New', monospace">swagger</text>
  <text x="135" y="38" fill="#ffffff" font-size="14">FAMS Training API - Subject Controller</text>
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="1120" height="570" rx="4" fill="#ffffff" stroke="#61affe" stroke-width="2"/>
    <rect x="0" y="0" width="1120" height="48" rx="4" fill="#ebf3fb" stroke="#61affe" stroke-width="1"/>
    <rect x="12" y="10" width="60" height="28" rx="3" fill="#61affe"/>
    <text x="24" y="29" fill="#ffffff" font-size="14" font-weight="bold">GET</text>
    <text x="85" y="30" fill="#3b4151" font-size="15" font-weight="bold" font-family="monospace">/api/subjects</text>
    <text x="220" y="30" fill="#666666" font-size="13">Lấy danh sách các môn học / chủ đề có phân trang, tìm kiếm và lọc</text>
    
    <text x="20" y="80" fill="#3b4151" font-size="14" font-weight="bold">Parameters:</text>
    <text x="30" y="105" fill="#333333" font-size="12" font-family="monospace">• search (string, query): "Java"</text>
    <text x="30" y="125" fill="#333333" font-size="12" font-family="monospace">• status (string, query): "ACTIVE"</text>
    <text x="30" y="145" fill="#333333" font-size="12" font-family="monospace">• page (integer, query): 0</text>
    <text x="30" y="165" fill="#333333" font-size="12" font-family="monospace">• size (integer, query): 10</text>
    
    <text x="20" y="205" fill="#3b4151" font-size="14" font-weight="bold">Responses:</text>
    <rect x="20" y="220" width="1080" height="330" rx="4" fill="#292d3e"/>
    <text x="35" y="245" fill="#49cc90" font-size="13" font-weight="bold">Code: 200 OK (application/json)</text>
    <text x="35" y="275" fill="#82aaff" font-size="12" font-family="Consolas, monospace">{</text>
    <text x="55" y="295" fill="#c3e88d" font-size="12" font-family="Consolas, monospace">"content"<tspan fill="#89ddff">: [</tspan></text>
    <text x="75" y="315" fill="#82aaff" font-size="12" font-family="Consolas, monospace">{ "id": 1, "code": "JAVA_CORE", "name": "Lập trình Java Core", "technicalGroup": "Java", "durationHours": 40, "status": "ACTIVE" },</text>
    <text x="75" y="335" fill="#82aaff" font-size="12" font-family="Consolas, monospace">{ "id": 2, "code": "SPRING_BOOT", "name": "Spring Boot &amp; Microservices", "technicalGroup": "Java", "durationHours": 60, "status": "ACTIVE" },</text>
    <text x="75" y="355" fill="#82aaff" font-size="12" font-family="Consolas, monospace">{ "id": 3, "code": "REACT_VITE", "name": "Frontend Web với React &amp; TypeScript", "technicalGroup": "Frontend", "durationHours": 45, "status": "ACTIVE" },</text>
    <text x="75" y="375" fill="#82aaff" font-size="12" font-family="Consolas, monospace">{ "id": 4, "code": "SQL_DATABASE", "name": "Cơ sở dữ liệu Quan hệ &amp; SQL Server", "technicalGroup": "Database", "durationHours": 30, "status": "ACTIVE" }</text>
    <text x="55" y="395" fill="#89ddff" font-size="12" font-family="Consolas, monospace">],</text>
    <text x="55" y="415" fill="#c3e88d" font-size="12" font-family="Consolas, monospace">"page"<tspan fill="#89ddff">: </tspan><tspan fill="#ff5370">0</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"size"</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#ff5370">10</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"totalElements"</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#ff5370">12</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"totalPages"</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#ff5370">2</tspan></text>
    <text x="35" y="435" fill="#82aaff" font-size="12" font-family="Consolas, monospace">}</text>
  </g>
</svg>