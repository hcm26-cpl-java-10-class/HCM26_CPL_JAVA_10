# PROPOSED: verified only in an isolated test. Not loaded by either running backend.
# SMTP is required for full-application readiness until the business owner explicitly decides otherwise.
# Add this file through a reviewed spring.config.additional-location during a future maintenance window.
# Do not put credentials in this file.
management.health.mail.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,mail
management.endpoint.health.group.smtp.include=mail
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Bound SMTP probe delays and require validated TLS. These do not supply/alter credentials.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Do not serialize authentication request/response bodies in DEBUG logs during preflight.
# SMTP health warnings remain visible; this does not suppress MailHealthIndicator.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
